<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure Shop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; color: #333; }

    header {
      background: #0078d4;
      color: white;
      padding: 1.2rem 2rem;
      font-size: 1.5rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #cart-btn {
      background: white;
      color: #0078d4;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    #cart-btn:hover { background: #e0eaf5; }

    main { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    h2 { margin-bottom: 1.5rem; color: #0078d4; }
    #status { margin-bottom: 1rem; color: #666; font-size: 0.9rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow: hidden;
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-4px); }
    .card img { width: 100%; height: 200px; object-fit: cover; background: #e0e0e0; }
    .card-body { padding: 1rem; }
    .card-body h3 { font-size: 1rem; margin-bottom: 0.4rem; }
    .card-body p { color: #666; font-size: 0.85rem; margin-bottom: 0.6rem; }
    .price { font-size: 1.2rem; font-weight: bold; color: #0078d4; margin-bottom: 0.8rem; }
    .add-btn {
      width: 100%;
      padding: 0.5rem;
      background: #0078d4;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .add-btn:hover { background: #005ea2; }

    .placeholder {
      width: 100%; height: 200px;
      background: linear-gradient(135deg, #e0eaf5 0%, #ccdced 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; color: #0078d4;
    }
    .error { color: #c00; background: #fff0f0; padding: 1rem; border-radius: 6px; }
    .loading { color: #888; }

    /* Cart sidebar */
    #cart-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 100;
    }
    #cart-sidebar {
      position: fixed; top: 0; right: 0;
      width: 360px; height: 100%;
      background: white;
      box-shadow: -4px 0 16px rgba(0,0,0,0.15);
      display: flex; flex-direction: column;
      z-index: 101;
      transform: translateX(100%);
      transition: transform 0.25s ease;
    }
    #cart-sidebar.open { transform: translateX(0); }
    #cart-header {
      background: #0078d4; color: white;
      padding: 1.2rem 1.5rem;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 1.1rem; font-weight: 600;
    }
    #close-cart { background: none; border: none; color: white; font-size: 1.4rem; cursor: pointer; }
    #cart-items { flex: 1; overflow-y: auto; padding: 1rem; }
    .cart-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.8rem 0; border-bottom: 1px solid #eee;
    }
    .cart-item-name { font-size: 0.95rem; }
    .cart-item-right { display: flex; align-items: center; gap: 0.8rem; }
    .cart-item-price { color: #0078d4; font-weight: 600; }
    .remove-btn {
      background: none; border: none; color: #c00;
      font-size: 1.1rem; cursor: pointer;
    }
    #cart-footer {
      padding: 1.2rem 1.5rem;
      border-top: 2px solid #eee;
    }
    #cart-total { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; }
    #clear-btn {
      width: 100%; padding: 0.7rem;
      background: #f4f6f9; border: 1px solid #ccc;
      border-radius: 6px; cursor: pointer; font-size: 0.9rem;
    }
    #clear-btn:hover { background: #e0e0e0; }
    #empty-msg { color: #888; text-align: center; margin-top: 2rem; }
  </style>
</head>
<body>
  <header>
    Azure Shop
    <button id="cart-btn" onclick="openCart()">🛒 Cart (<span id="cart-count">0</span>)</button>
  </header>

  <main>
    <h2>Products</h2>
    <div id="status" class="loading">Loading products...</div>
    <div id="grid" class="grid"></div>
  </main>

  <!-- Cart -->
  <div id="cart-overlay" onclick="closeCart()"></div>
  <div id="cart-sidebar">
    <div id="cart-header">
      Your Cart
      <button id="close-cart" onclick="closeCart()">✕</button>
    </div>
    <div id="cart-items"></div>
    <div id="cart-footer">
      <div id="cart-total">Total: $0.00</div>
      <button id="clear-btn" onclick="clearCart()">Clear Cart</button>
    </div>
  </div>

  <script>
    let cart = [];

    function openCart() {
      document.getElementById('cart-overlay').style.display = 'block';
      document.getElementById('cart-sidebar').classList.add('open');
      renderCart();
    }

    function closeCart() {
      document.getElementById('cart-overlay').style.display = 'none';
      document.getElementById('cart-sidebar').classList.remove('open');
    }

    function addToCart(id, name, price) {
      const existing = cart.find(i => i.id === id);
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ id, name, price, qty: 1 });
      }
      updateCartCount();
    }

    function removeFromCart(id) {
      cart = cart.filter(i => i.id !== id);
      updateCartCount();
      renderCart();
    }

    function clearCart() {
      cart = [];
      updateCartCount();
      renderCart();
    }

    function updateCartCount() {
      const total = cart.reduce((sum, i) => sum + i.qty, 0);
      document.getElementById('cart-count').textContent = total;
    }

    function renderCart() {
      const container = document.getElementById('cart-items');
      const totalEl = document.getElementById('cart-total');
      if (cart.length === 0) {
        container.innerHTML = '<div id="empty-msg">Your cart is empty</div>';
        totalEl.textContent = 'Total: $0.00';
        return;
      }
      container.innerHTML = cart.map(i => `
        <div class="cart-item">
          <div class="cart-item-name">${i.name} × ${i.qty}</div>
          <div class="cart-item-right">
            <span class="cart-item-price">$${(i.price * i.qty).toFixed(2)}</span>
            <button class="remove-btn" onclick="removeFromCart(${i.id})">✕</button>
          </div>
        </div>
      `).join('');
      const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
      totalEl.textContent = `Total: $${total.toFixed(2)}`;
    }

    async function loadProducts() {
      const status = document.getElementById('status');
      const grid = document.getElementById('grid');
      try {
        const res = await fetch('/products');
        if (!res.ok) throw new Error('API error ' + res.status);
        const products = await res.json();
        status.textContent = `${products.length} product(s) found`;
        grid.innerHTML = products.map(p => `
          <div class="card">
            ${p.image_url
              ? `<img src="${p.image_url}" alt="${p.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
              : ''
            }
            <div class="placeholder" style="display:${p.image_url ? 'none' : 'flex'}">🛒</div>
            <div class="card-body">
              <h3>${p.name}</h3>
              <p>${p.description || ''}</p>
              <div class="price">$${parseFloat(p.price).toFixed(2)}</div>
              <button class="add-btn" onclick="addToCart(${p.id}, '${p.name}', ${p.price})">Add to Cart</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        status.textContent = '';
        grid.innerHTML = `<div class="error">Could not load products: ${err.message}</div>`;
      }
    }

    loadProducts();
  </script>
</body>
</html>
